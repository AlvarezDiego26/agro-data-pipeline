[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-orquestacion-prefect"
version = "0.1.0"
description = "Orquestacion Prefect para pipelines SISAP y SUNAT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "prefect>=3,<4",
  "pydantic-settings>=2,<3",
  "python-dotenv==1.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

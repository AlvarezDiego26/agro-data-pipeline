services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_SERVER_UI_API_URL: http://localhost:4200/api
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server start --no-services
    ports:
      - "4200:4200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    image: prefecthq/prefect:3-latest
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@postgres:5432/prefect
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server services start

  duckdb:
    image: duckdb/duckdb:latest
    container_name: duckdb-agro
    env_file:
      - .env
    stdin_open: true
    tty: true
    working_dir: /data
    command: ["/duckdb", ":memory:"]
    ports:
      - "4213:4213"
    volumes:
      - ../../agro-analitica/db/duckdb/runtime/data:/data
      - ../../agro-analitica/db/duckdb/runtime/scripts:/scripts
      - ../../agro-analitica/db/duckdb/runtime/sql:/sql
      - ../../agro-analitica/db/duckdb/validation:/validation
    restart: unless-stopped

  prefect-worker:
    image: prefecthq/prefect:3-latest
    container_name: prefect-worker
    depends_on:
      prefect-server:
        condition: service_healthy
      duckdb:
        condition: service_started
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
      - ..:/app
      - ../../agro-analitica:/agro-analitica
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: >
      bash -c "
        command -v docker >/dev/null 2>&1 || (apt-get update && apt-get install -y docker.io) &&
        cd /app/orquestacion-prefect &&
        pip install -e . &&
        prefect worker start --pool local-pool --type process --limit $${PREFECT_WORKER_PROCESS_LIMIT:-1}
      "
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sisap-light-pipeline"
version = "0.2.0"
description = "Proyecto liviano para extraccion SISAP via HTTP + HTML + Polars"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "selectolax==0.3.26",
  "lxml==5.4.0",
  "polars==1.30.0",
  "pyarrow==20.0.0",
  "deltalake==0.18.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "python-dotenv==1.1.0",
  "typer==0.15.4",
  "tenacity==9.1.2",
  "loguru==0.7.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midagri-boletines-pipeline"
version = "0.1.0"
description = "Extractor ligero de boletines de precios y abastecimiento diarios MIDAGRI GMML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1",
  "beautifulsoup4==4.12.3",
  "lxml==5.4.0",
  "polars==1.30.0",
  "pyarrow==20.0.0",
  "deltalake==0.18.2",
  "pydantic==2.11.4",
  "pydantic-settings==2.9.1",
  "python-dotenv==1.1.0",
  "typer==0.15.4",
  "tenacity==9.1.2",
  "loguru==0.7.3",
  "pdfplumber==0.11.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
